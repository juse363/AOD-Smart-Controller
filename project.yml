name: NEXUS
options:
  bundleIdPrefix: com.aodsmart
  deploymentTarget:
    iOS: "27.2"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  NEXUS:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - .git
          - .git/**
          - .github
          - .github/**
          - build
          - build/**
          - README.md
          - README-0.2.0.md
          - README-0.2.2.md
          - README-0.3.0.md
          - README-0.2.1.md
          - README-NEXUS.md
          - Branding
          - Branding/**
          - project.yml
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aodsmart.controller
        PRODUCT_NAME: "NEXUS"
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "19"
        INFOPLIST_KEY_CFBundleDisplayName: "NEXUS"
        INFOPLIST_KEY_NSMotionUsageDescription: "用于判断手机是否屏幕朝下。"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
