name: AODSmartController
options:
  bundleIdPrefix: com.aodsmart
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  AODSmartController:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - .git
          - .git/**
          - .github
          - .github/**
          - build
          - build/**
          - README.md
          - README-0.2.0.md
          - project.yml
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aodsmart.controller
        INFOPLIST_KEY_CFBundleDisplayName: "AOD Smart"
        INFOPLIST_KEY_CFBundleShortVersionString: "0.2.2"
        INFOPLIST_KEY_CFBundleVersion: "4"
        INFOPLIST_KEY_NSMotionUsageDescription: "用于判断手机是否屏幕朝下。"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
