name: Build NEXUS Workspace IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/aod-0.2.0
      - feature/aod-0.2.1
      - feature/aod-0.2.2
      - feature/aod-0.3.0-ui
      - feature/nexus-0.4.0-branding
      - feature/nexus-0.4.1-battery-center
      - feature/nexus-0.4.2-entitlement-diagnostics\n      - feature/nexus-0.4.3-dashboard-redesign
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen librsvg

      - name: Render NEXUS app icon
        run: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 Branding/NEXUS-AppIcon.svg \
            -o Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project NEXUS.xcodeproj \
            -scheme NEXUS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NEXUS.app Payload/
          zip -r NEXUS-0.4.3-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-0.4.3-unsigned-IPA
          path: NEXUS-0.4.3-unsigned.ipa
